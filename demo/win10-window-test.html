<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows 10 风格窗口组件测试</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.0.0/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4.2.0/dist/vue-router.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"></link>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="max-w-6xl mx-auto">
      <h1>Windows 10 风格窗口组件测试</h1>
      <p>这是一个简单的测试页面，用于验证 Windows 10 风格窗口组件。</p>
      
      <div class="mt-4">
        <button @click="showWindow = true" class="px-4 py-2 bg-blue-500 text-white rounded">打开窗口</button>
      </div>
      
      <div class="mt-8">
        <h2>窗口内容</h2>
        <div v-if="showWindow" class="border rounded-lg shadow-lg p-6" style="width: 600px; position: relative;">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold">Windows 10 窗口</h3>
            <div class="flex gap-2">
              <button @click="minimizeWindow" class="w-8 h-8 flex items-center justify-center hover:bg-gray-200 rounded">
                <i class="fas fa-minus"></i>
              </button>
              <button @click="maximizeWindow" class="w-8 h-8 flex items-center justify-center hover:bg-gray-200 rounded">
                <i class="fas fa-expand"></i>
              </button>
              <button @click="closeWindow" class="w-8 h-8 flex items-center justify-center hover:bg-red-200 rounded">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>
          
          <div class="window-content">
            <h4>窗口内容区域</h4>
            <p>这是一个 Windows 10 风格的窗口组件测试。</p>
            <div class="mt-4">
              <input type="text" placeholder="输入框测试" class="border rounded px-3 py-2 w-full max-w-xs">
              <button class="mt-2 px-4 py-2 bg-blue-500 text-white rounded">按钮测试</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const showWindow = ref(false);
        
        const minimizeWindow = () => {
          console.log('最小化窗口');
        };
        
        const maximizeWindow = () => {
          console.log('最大化窗口');
        };
        
        const closeWindow = () => {
          showWindow.value = false;
        };
        
        return {
          showWindow,
          minimizeWindow,
          maximizeWindow,
          closeWindow
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
